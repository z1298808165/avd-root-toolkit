name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    name: shell script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash syntax
        run: bash -n scripts/avd-root.sh

      - name: shellcheck
        run: shellcheck --severity=warning scripts/avd-root.sh

  powershell:
    name: powershell script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: parse
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/avd-root.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: PSScriptAnalyzer (errors only)
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $issues = Invoke-ScriptAnalyzer -Path scripts/avd-root.ps1 -Severity Error
          if ($issues) {
            $issues | Format-Table -AutoSize | Out-String | Write-Host
            exit 1
          }

  contract:
    name: cross-platform parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: both entry scripts expose the same actions
        run: |
          set -eu
          # .gitattributes 会把 *.ps1 检出为 CRLF，比较前先去掉回车
          a=$(grep -m1 'ACTIONS:' scripts/avd-root.sh | sed 's/.*ACTIONS:[[:space:]]*//' | tr -d '\r')
          b=$(grep -m1 'ACTIONS:' scripts/avd-root.ps1 | sed 's/.*ACTIONS:[[:space:]]*//' | tr -d '\r')
          echo "sh : $a"
          echo "ps1: $b"
          if [ "$a" != "$b" ]; then
            echo "::error::action lists differ between avd-root.sh and avd-root.ps1"
            exit 1
          fi

  docs:
    name: markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: relative links resolve
        run: |
          python3 - <<'PY'
          import os, re, sys

          pattern = re.compile(r'\]\(([^)#\s]+)')
          broken = []

          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in {'.git', 'node_modules'}]
              for name in files:
                  if not name.endswith('.md'):
                      continue
                  path = os.path.join(root, name)
                  text = open(path, encoding='utf-8').read()
                  for match in pattern.finditer(text):
                      target = match.group(1)
                      if target.startswith(('http://', 'https://', 'mailto:')):
                          continue
                      resolved = os.path.normpath(os.path.join(root, target))
                      if not os.path.exists(resolved):
                          broken.append(f'{path}: {target}')

          if broken:
              print('broken relative links:')
              print('\n'.join(broken))
              sys.exit(1)
          print('all relative links resolve')
          PY
